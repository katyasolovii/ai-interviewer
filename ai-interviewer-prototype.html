<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI-Interviewer: тренажер технічних співбесід</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --canvas:#EEF1F8; --paper:#FFFFFF; --ink:#14213D; --ink-2:#4B5877; --line:#D3DBEC; --line-2:#E4E9F4;
  --blue:#1F4FD8; --on-blue:#FFFFFF; --blue-soft:#E3EAFF; --blue-line:#B4C5FA;
  --yellow:#FFD500; --on-yellow:#14213D;
  --good:#17805A; --good-soft:#DDF2E8;
  --mid:#8F5F00; --mid-soft:#FFF0C7; --mid-bar:#E9A800;
  --bad:#B93325; --bad-soft:#FBE3DF; --bad-bar:#D9503F;
  --code-bg:#F3F5FB;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 18px 40px -18px rgba(20,33,61,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#0E1424; --paper:#161E33; --ink:#E9EDF9; --ink-2:#A3AEC9; --line:#2B3658; --line-2:#222C48;
    --blue:#7C9CFF; --on-blue:#0E1424; --blue-soft:#1E2A52; --blue-line:#34478A;
    --yellow:#FFD84A; --on-yellow:#14213D;
    --good:#4CC594; --good-soft:#15332B;
    --mid:#F0B84A; --mid-soft:#3A2F14; --mid-bar:#E9A800;
    --bad:#FF8A78; --bad-soft:#3B1F22; --bad-bar:#F0705E;
    --code-bg:#0F1730;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --canvas:#0E1424; --paper:#161E33; --ink:#E9EDF9; --ink-2:#A3AEC9; --line:#2B3658; --line-2:#222C48;
  --blue:#7C9CFF; --on-blue:#0E1424; --blue-soft:#1E2A52; --blue-line:#34478A;
  --yellow:#FFD84A; --on-yellow:#14213D;
  --good:#4CC594; --good-soft:#15332B;
  --mid:#F0B84A; --mid-soft:#3A2F14; --mid-bar:#E9A800;
  --bad:#FF8A78; --bad-soft:#3B1F22; --bad-bar:#F0705E;
  --code-bg:#0F1730;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -18px rgba(0,0,0,.7);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--canvas) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line-2)}
.top-in{position:relative;max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:1.05rem}
.brand svg{width:30px;height:30px;flex:none}
.navbtn{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.9rem;cursor:pointer}
.navbtn:hover{border-color:var(--blue-line)}
.navbtn svg{width:16px;height:16px}
.navpop{position:absolute;right:20px;top:calc(100% + 6px);width:min(340px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:8px}
.navpop[hidden]{display:none}
.nav-note{font-size:.82rem;color:var(--ink-2);padding:8px 12px 6px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:600}
.nav-item:hover{background:var(--canvas)}
.nav-item.on{background:var(--blue-soft);color:var(--blue)}
.nav-n{flex:none;min-width:34px;text-align:center;font-size:.8rem;font-weight:800;border-radius:8px;padding:2px 6px;background:var(--canvas);color:var(--ink-2)}
.nav-item.on .nav-n{background:var(--blue);color:var(--on-blue)}

main{max-width:1080px;margin:0 auto;padding:28px 20px 72px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:12px;border:1.5px solid transparent;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s,filter .15s}
.btn.primary{background:var(--blue);color:var(--on-blue)}
.btn.primary:hover:not(:disabled){filter:brightness(1.1)}
.btn.primary:disabled{background:var(--line);color:var(--ink-2);cursor:not-allowed}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover:not(:disabled){background:var(--paper);border-color:var(--blue-line)}
.btn.ghost:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}

/* welcome */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);gap:56px;align-items:center;min-height:min(640px,calc(100vh - 160px))}
.display{font-size:clamp(2.1rem,4.4vw,3.3rem);line-height:1.08;letter-spacing:-.028em;font-weight:800;margin-bottom:18px}
.lead{font-size:1.125rem;color:var(--ink-2);max-width:46ch}
.preview{margin-top:34px;display:flex;flex-direction:column;gap:10px;max-width:470px}
.b-ai{display:flex;gap:10px;align-items:flex-start}
.avatar{flex:none;width:34px;height:34px;border-radius:50%;background:var(--yellow);color:var(--on-yellow);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.b-ai .txt{background:var(--paper);border:1px solid var(--line);border-radius:6px 18px 18px 18px;padding:12px 16px;font-weight:600}
.b-me{align-self:flex-end;background:var(--blue-soft);border:1px dashed var(--blue-line);border-radius:18px 18px 6px 18px;padding:10px 16px;color:var(--ink-2);min-width:60%}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--blue);vertical-align:-.15em;margin-left:2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:var(--shadow)}
.panel h2{font-size:1.3rem;letter-spacing:-.01em;margin-bottom:16px}
.panel h3{font-size:.95rem;margin:22px 0 10px;color:var(--ink-2);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:border-color .15s,background .15s}
.tile:hover{border-color:var(--blue-line)}
.tile .mono{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font-weight:800;font-size:.9rem}
.tile b{display:block;font-size:.98rem;line-height:1.2}
.tile small{display:block;color:var(--ink-2);font-size:.78rem;line-height:1.3;margin-top:2px}
.tile[aria-checked="true"]{border-color:var(--blue);background:var(--blue-soft)}
.tile[aria-checked="true"] .mono{background:var(--blue);color:var(--on-blue)}
.seg{display:flex;gap:4px;border:1.5px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:10px 8px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.seg button[aria-checked="true"]{background:var(--blue-soft);color:var(--blue)}
.panel .btn{margin-top:26px}

/* prep */
.narrow{max-width:760px;margin:0 auto}
.crumb{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--ink-2);margin-bottom:14px}
.h1{font-size:clamp(1.8rem,3.6vw,2.6rem);line-height:1.1;letter-spacing:-.025em;font-weight:800}
.sub{color:var(--ink-2);margin-top:10px;font-size:1.05rem}
.prep-grid{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:32px;margin-top:30px;align-items:start}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
.rules li{padding-left:18px;border-left:3px solid var(--blue-line)}
.rules b{display:block;font-size:1.02rem}
.rules span{color:var(--ink-2)}
.timer-tile{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:center;box-shadow:var(--shadow)}
.timer-tile .big{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.timer-tile p{color:var(--ink-2);font-size:.88rem;margin-top:8px}
.row-actions{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}

/* interview */
.iv{max-width:780px;margin:0 auto}
.iv-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.iv-meta{display:flex;align-items:center;gap:10px;font-weight:700}
.iv-meta .mono{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--blue);color:var(--on-blue);font-weight:800;font-size:.8rem}
.steps{display:flex;align-items:center;gap:6px;list-style:none;padding:0;margin:0}
.steps li{width:34px;height:6px;border-radius:99px;background:var(--line)}
.steps li.done{background:var(--blue)}
.steps li.now{background:var(--yellow);width:52px}
.steps-label{font-size:.88rem;font-weight:700;color:var(--ink-2);margin-left:6px}
.steps-wrap{display:flex;align-items:center}
.timer{font-variant-numeric:tabular-nums;font-weight:800;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--paper)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.msg{display:flex;gap:14px;align-items:flex-start}
.msg .avatar{width:40px;height:40px}
.bubble{background:var(--paper);border:1px solid var(--line);border-radius:6px 22px 22px 22px;padding:20px 22px;flex:1;min-width:0;box-shadow:var(--shadow)}
.who{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:.9rem}
.who b{font-weight:800}
.pill{font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--blue-soft);color:var(--blue)}
.prevq{font-size:.9rem;color:var(--ink-2);background:var(--canvas);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.q{font-size:clamp(1.25rem,2.6vw,1.6rem);line-height:1.3;letter-spacing:-.015em;font-weight:700}
pre.code{margin:14px 0 0;background:var(--code-bg);border:1px solid var(--line-2);border-radius:12px;padding:14px 16px;overflow-x:auto;max-width:100%}
pre.code code{font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.88rem;line-height:1.6}
.dots{display:flex;gap:6px;padding:8px 0}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--ink-2);opacity:.35;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{40%{opacity:1;transform:translateY(-3px)}}
.answer{margin-top:22px;margin-left:54px}
.answer label{display:block;font-weight:700;margin-bottom:8px}
.answer textarea{width:100%;min-height:190px;resize:vertical;font:inherit;line-height:1.55;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px}
.answer textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.answer textarea:disabled{opacity:.55}
.actions{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.actions .hint{flex:1;color:var(--ink-2);font-size:.85rem;min-width:140px}

/* finish */
.finish{max-width:520px;margin:6vh auto 0;text-align:center}
.done-mark{width:76px;height:76px;border-radius:50%;background:var(--yellow);color:var(--on-yellow);display:grid;place-items:center;margin:0 auto 22px}
.done-mark svg{width:38px;height:38px}
.checks{list-style:none;padding:0;margin:26px auto 0;display:flex;flex-direction:column;gap:10px;text-align:left;max-width:320px}
.checks li{display:flex;align-items:center;gap:12px;color:var(--ink-2);font-weight:600}
.checks .ic{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.checks li.ok{color:var(--ink)}
.checks li.ok .ic{background:var(--good);border-color:var(--good);color:var(--paper)}
.checks .ic svg{width:13px;height:13px;opacity:0}
.checks li.ok .ic svg{opacity:1}
.finish .btn{margin-top:30px}

/* results */
.tabs{display:inline-flex;gap:4px;border:1.5px solid var(--line);border-radius:14px;padding:4px;margin-bottom:22px;background:var(--paper)}
.tabs button{border:0;background:none;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.tabs button[aria-current="page"]{background:var(--blue-soft);color:var(--blue)}
.groups{margin-top:30px;display:flex;flex-direction:column;gap:32px}
.g-head{display:flex;align-items:center;gap:10px;font-size:1.1rem;font-weight:800;margin-bottom:6px}
.dot{width:12px;height:12px;border-radius:50%}
.dot.good{background:var(--good)}.dot.mid{background:var(--mid-bar)}.dot.bad{background:var(--bad-bar)}
.bar-row{display:grid;grid-template-columns:minmax(150px,240px) 1fr 52px;gap:16px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-2)}
.bar-label{font-weight:600}
.bar-track{position:relative;height:14px;border-radius:99px;background:var(--line-2)}
.bar-fill{height:100%;border-radius:99px}
.bar-fill.good{background:var(--good)}.bar-fill.mid{background:var(--mid-bar)}.bar-fill.bad{background:var(--bad-bar)}
.bar-mark{position:absolute;left:70%;top:-5px;bottom:-5px;border-left:2px dashed var(--ink-2);opacity:.6}
.bar-val{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.legend{font-size:.85rem;color:var(--ink-2);margin-top:18px;display:flex;align-items:center;gap:10px}
.legend i{display:inline-block;height:14px;border-left:2px dashed var(--ink-2);opacity:.7}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--blue-soft);color:var(--ink);border-radius:14px;padding:12px 16px;font-size:.9rem;margin-top:22px}
.note svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--blue)}

/* report */
.rlist{margin-top:26px}
.rq{border-top:1px solid var(--line)}
.rq:last-child{border-bottom:1px solid var(--line)}
.rq summary{list-style:none;display:flex;align-items:center;gap:12px;padding:18px 4px;cursor:pointer;flex-wrap:wrap}
.rq summary::-webkit-details-marker{display:none}
.rq summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg);transition:transform .15s}
.rq[open] summary::after{transform:rotate(-135deg)}
.rq .qn{font-weight:800;font-size:1.05rem}
.rq .qk{color:var(--ink-2);font-weight:600;font-size:.92rem}
.verdict{font-size:.8rem;font-weight:800;border-radius:999px;padding:3px 11px}
.v-ok{background:var(--good-soft);color:var(--good)}
.v-partial{background:var(--mid-soft);color:var(--mid)}
.v-weak{background:var(--bad-soft);color:var(--bad)}
.v-skip{background:var(--line-2);color:var(--ink-2)}
.rq-body{padding:2px 4px 26px}
.rq-body .qt{font-weight:700;font-size:1.1rem;line-height:1.35;max-width:62ch}
.yours{margin-top:16px}
.yours h4,.fb h4{font-size:.92rem;margin-bottom:4px}
.yours p{white-space:pre-wrap;color:var(--ink-2);border-left:3px solid var(--line);padding-left:14px;overflow-wrap:anywhere}
.fb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
.fb section{border-radius:14px;padding:14px 16px}
.fb .g{background:var(--good-soft)}.fb .g h4{color:var(--good)}
.fb .m{background:var(--bad-soft)}.fb .m h4{color:var(--bad)}
.fb .b{background:var(--blue-soft)}.fb .b h4{color:var(--blue)}
.fb p{font-size:.93rem;line-height:1.5}
.rep{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;font-weight:700;font-size:.9rem}
.chip{border:1.5px solid var(--blue-line);color:var(--blue);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.85rem;background:var(--paper)}
.plan{margin-top:40px}
.plan h2{font-size:1.35rem;letter-spacing:-.01em;margin-bottom:14px}
.plan ol{margin:0;padding:0;list-style:none;counter-reset:p;display:flex;flex-direction:column;gap:10px}
.plan li{counter-increment:p;display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:700}
.plan li::before{content:counter(p);flex:none;width:28px;height:28px;border-radius:50%;background:var(--yellow);color:var(--on-yellow);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.plan li small{margin-left:auto;color:var(--ink-2);font-weight:600}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:28px;min-height:0}
  .preview{display:none}
  .prep-grid{grid-template-columns:1fr}
  .fb{grid-template-columns:1fr}
  .answer{margin-left:0}
  .bar-row{grid-template-columns:1fr 52px;gap:6px 12px}
  .bar-label{grid-column:1 / -1}
  .bar-track{grid-column:1}
  .bar-val{grid-column:2}
}
@media (max-width:480px){
  main{padding:20px 16px 56px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .panel{padding:20px}
  .msg .avatar{display:none}
  .bubble{padding:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--blue)"/><path d="M9 10.5h14a2 2 0 0 1 2 2v6.5a2 2 0 0 1-2 2h-6l-4.5 3.7V21H9a2 2 0 0 1-2-2v-6.5a2 2 0 0 1 2-2z" fill="var(--yellow)"/></svg>
      AI-Interviewer
    </div>
    <button class="navbtn" id="navbtn" data-a="navtoggle" aria-expanded="false" aria-controls="navpop">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
      Екрани
    </button>
    <div class="navpop" id="navpop" hidden></div>
  </div>
</header>
<main id="app"></main>
<noscript><p style="padding:24px">Для роботи прототипу потрібен JavaScript.</p></noscript>

<script>
(function(){
"use strict";
var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
var TOTAL = 20*60;
var $ = function(s,r){return (r||document).querySelector(s);};
var esc = function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};

var LEVELS = ['Trainee','Junior','Junior+'];
var QTYPE = ['Основне питання','Уточнення 1','Уточнення 2','Уточнення 3','Уточнення 4'];
var VLABEL = {ok:'Добре',partial:'Частково',weak:'Потрібно повторити',skip:'Без відповіді'};

var DIRS = [
{ id:'python', name:'Python', mono:'Py', blurb:'Колекції, змінність, код',
  topics:[{n:'Типи даних і колекції',s:82},{n:'Змінність об’єктів',s:41},{n:'Хешування і словники',s:70},{n:'Читання коду',s:58}],
  q:[

function remaining(){
  if(!S.startedAt) return TOTAL;
  var el = Math.floor(((S.endedAt||Date.now())-S.startedAt)/1000);
  return Math.max(0,TOTAL-el);
}
function fmt(sec){var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function clip(s,n){s=s.replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n).trim()+'…':s;}
function plural(n){return n===1?'запитання':'запитання';}

/* ---------- results ---------- */
function computeVerdict(text,kw){
  var t=(text||'').trim();
  kw=kw||[];
  if(!t) return {v:'skip',matched:[],missing:kw.map(function(k){return k.label;})};
  var low=t.toLowerCase();
  var words=t.split(/\s+/).filter(Boolean).length;
  var matched=[],missing=[];
  kw.forEach(function(k){(k.re.test(low)?matched:missing).push(k.label);});
  var frac=kw.length?matched.length/kw.length:(words>=6?1:0);
  var v;
  if(words<4) v='weak';
  else if(frac>=0.66) v='ok';
  else if(frac>=0.33) v='partial';
  else v='weak';
  return {v:v,matched:matched,missing:missing};
}
function result(){
  var d=D(), ans=S.answers.map(function(a){return !!a.trim();});
  var verdicts=d.q.map(function(q,i){return computeVerdict(S.answers[i],q.kw);});
  var topics=d.topics.map(function(t,i){
    var qs=[];d.q.forEach(function(q,qi){if(q.t.indexOf(i)>-1)qs.push(qi);});
    if(!qs.length) return {n:t.n,s:t.s};
    var touched=qs.filter(function(qi){return ans[qi];});
    if(!touched.length) return {n:t.n,s:Math.min(t.s,22)};
    var avgFrac=touched.reduce(function(sum,qi){
      var kw=d.q[qi].kw||[];
      var m=kw.length?verdicts[qi].matched.length/kw.length:1;
      return sum+m;
    },0)/touched.length;
    var adjusted=Math.round(t.s*(0.55+0.45*avgFrac));
    return {n:t.n,s:Math.max(15,Math.min(97,adjusted))};
  });
  return {
    ans:ans,
    verdicts:verdicts,
    strong:topics.filter(function(t){return t.s>=70;}).sort(function(a,b){return b.s-a.s;}),
    mid:topics.filter(function(t){return t.s>=50&&t.s<70;}).sort(function(a,b){return b.s-a.s;}),
    weak:topics.filter(function(t){return t.s<50;}).sort(function(a,b){return a.s-b.s;}),
    all:topics
  };
}

    var good, gap;
    if(!R.ans[i]){
      good='Цього разу без відповіді. Подивіться сильнішу відповідь нижче й спробуйте ще раз.';
      gap='Без відповіді складно оцінити, що ви вже знаєте.';
    } else if(res.matched.length){
      good='У відповіді прозвучало: '+res.matched.join('; ')+'.';
      gap=res.missing.length?'Не прозвучало: '+res.missing.join('; ')+'.':'Основні тези по темі прозвучали.';
    } else {
      good='У відповіді не вдалося знайти жодної ключової тези по темі питання.';
      gap='Бракує по суті всього: '+res.missing.join('; ')+'.';

    return '<details class="rq" open>'+
      '<summary><span class="qn">Питання '+(i+1)+'</span><span class="qk">'+QTYPE[i]+'</span><span class="verdict v-'+v+'">'+VLABEL[v]+'</span></summary>'+

          '<section class="b"><h4>Сильніша відповідь</h4><p>'+esc(q.better)+'</p></section>'+
        '</div>'+
        '<div class="rep">Повторити: '+q.repeat.map(function(r){return '<span class="chip">'+esc(r)+'</span>';}).join('')+'</div>'+
      '</div></details>';

  var order=[];
  d.q.forEach(function(q,i){
    var qv=R.verdicts[i].v;
    var rank=qv==='skip'?0:qv==='weak'?1:qv==='partial'?2:3;
    if(rank<3) order.push({i:i,q:q,rank:rank});
  });
  order.sort(function(a,b){return a.rank-b.rank||a.i-b.i;});
  var seen={},plan=[];
  order.forEach(function(o){o.q.repeat.forEach(function(r){if(!seen[r]){seen[r]=1;plan.push('<li>'+esc(r)+'<small>з питання '+(o.i+1)+'</small></li>');}});});

  return '<section class="narrow" style="max-width:860px">'+
    tabs('report')+
    '<h1 class="h1" tabindex="-1">Розбір відповідей</h1>'+
    '<p class="sub">Що вийшло, чого не вистачило й що повторити перед справжньою співбесідою.</p>'+
    '<div class="note"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="8"/><path d="M10 9v5M10 6.2v.1"/></svg><span>У прототипі оцінку рахує проста перевірка ключових слів у вашому тексті, а не справжній ШІ, тому вона груба. У повній версії розбір формуватиме мовна модель.</span></div>'+
    '<div class="rlist">'+items+'</div>'+
    (plan.length?'<div class="plan"><h2>План повторення</h2><ol>'+plan.join('')+'</ol></div>':'')+
    '<div class="cta-row"><button class="btn primary" data-a="again">Пройти ще раз</button>'+
    '<button class="btn ghost" data-a="newdir">Обрати інший напрям</button></div>'+
  '</section>';
}

function view(){
  switch(S.screen){
    case 'welcome': return vWelcome();
    case 'prep': return vPrep();
    case 'q0': case 'q1': case 'q2': case 'q3': case 'q4': return vQ(qIndex());
    case 'finish': return vFinish();
    case 'profile': return vProfile();
    case 'report': return vReport();
  }
  return '';
}

function renderNav(){
  var pop=$('#navpop'), btn=$('#navbtn');
  btn.setAttribute('aria-expanded',String(S.navOpen));
  pop.hidden=!S.navOpen;
  if(!S.navOpen) return;
  pop.innerHTML='<div class="nav-note">Клікабельний прототип: перейдіть до будь-якого екрана.</div>'+
    SCREENS.map(function(s){
      return '<button class="nav-item'+(S.screen===s.id?' on':'')+'" data-a="jump" data-v="'+s.id+'"><span class="nav-n">'+s.n+'</span>'+s.label+'</button>';
    }).join('');
}
function render(){
  $('#app').innerHTML=view();
  renderNav();
}
function focusAfter(){
  if(isQ() && !S.typing){var ta=$('#ans');if(ta){ta.focus({preventScroll:true});var l=ta.value.length;ta.setSelectionRange(l,l);}return;}
  var h=$('#app h1');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}
}

/* ---------- flow ---------- */
function go(id,opts){
  opts=opts||{};
  S.screen=id;S.navOpen=false;
  S.typing=!!opts.typing&&!REDUCED;
  render();
  window.scrollTo(0,0);
  focusAfter();
  if(S.typing){
    setTimeout(function(){
      if(S.screen===id&&S.typing){S.typing=false;render();focusAfter();}
    },900);
  }
}
function start(){
  S.answers=D().q.map(function(){return '';});S.startedAt=Date.now();S.endedAt=null;
  go('q0',{typing:true});
}
function finishInterview(){
  S.endedAt=Date.now();
  S.analysis=REDUCED?3:0;
  go('finish');
  if(!REDUCED){
    var i=0;
    var step=function(){
      if(S.screen!=='finish') return;
      S.analysis=++i;render();
      if(i<3) setTimeout(step,650);
    };
    setTimeout(step,650);
  }
}
function next(skip){
  var i=qIndex(),ta=$('#ans'),last=D().q.length-1;
  if(ta) S.answers[i]=ta.value;
  if(skip) S.answers[i]='';
  if(i<last) go('q'+(i+1),{typing:true}); else finishInterview();
}
function reset(){S.answers=D().q.map(function(){return '';});S.startedAt=null;S.endedAt=null;}
function jump(id){
  var late=['finish','profile','report'].indexOf(id)>-1;
  if(isQOrId(id)||late){
    var upto=late?D().q.length:+id.charAt(1);
    for(var i=0;i<upto;i++) if(!S.answers[i]||!S.answers[i].trim()) S.answers[i]=D().q[i].demo;
    if(!S.startedAt) S.startedAt=Date.now();
  }
  if(late&&!S.endedAt) S.endedAt=Date.now();
  if(late) S.analysis=3;
  go(id);
}
function isQOrId(id){return /^q\d$/.test(id);}

function tick(){
  if(!S.startedAt||S.endedAt||!isQ()) return;
  var r=remaining(),el=$('.timer');
  if(el){el.textContent=fmt(r);el.classList.toggle('low',r<=120);}
  if(r<=0){
    var ta=$('#ans');if(ta&&!ta.disabled) S.answers[qIndex()]=ta.value;
    finishInterview();
  }
}
setInterval(tick,500);

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');
  if(S.navOpen&&!e.target.closest('.top-in')){S.navOpen=false;renderNav();}
  if(!t) return;
  var v=t.dataset.v;
  switch(t.dataset.a){
    case 'dir': S.dir=+v;render();var a=$('[data-a="dir"][data-v="'+v+'"]');if(a)a.focus({preventScroll:true});break;
    case 'level': S.level=+v;render();var b=$('[data-a="level"][data-v="'+v+'"]');if(b)b.focus({preventScroll:true});break;
    case 'toprep': go('prep');break;
    case 'backwelcome': go('welcome');break;
    case 'start': start();break;
    case 'next': next(false);break;
    case 'skip': next(true);break;
    case 'goto': go(v);break;
    case 'again': reset();go('prep');break;
    case 'newdir': reset();go('welcome');break;
    case 'navtoggle': S.navOpen=!S.navOpen;renderNav();break;
    case 'jump': jump(v);break;
  }
});
document.addEventListener('input',function(e){
  if(e.target.id!=='ans') return;
  var v=e.target.value,has=!!v.trim();
  S.answers[qIndex()]=v;
  var n=$('[data-a="next"]'),s=$('[data-a="skip"]');
  if(n)n.disabled=!has;
  if(s)s.disabled=has;
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&S.navOpen){S.navOpen=false;renderNav();$('#navbtn').focus();}
  if(e.target&&e.target.id==='ans'&&(e.ctrlKey||e.metaKey)&&e.key==='Enter'){
    e.preventDefault();
    if(e.target.value.trim()) next(false);
  }
});

render();
})();
</script>
</body>
</html>
